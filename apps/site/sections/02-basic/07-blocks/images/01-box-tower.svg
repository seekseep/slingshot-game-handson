<text x="418" y="457.95" text-anchor="middle" font-size="17" fill="#475569" font-weight="600" font-family="'SFMono-Regular','Consolas','Noto Sans Mono','Courier New',monospace">towerX = 560</text>
<text x="466" y="492" text-anchor="middle" font-size="13" fill="#475569" font-weight="400">y が 40 小さいほど 1 段上。いちばん下の箱は半分 (20) 上げて地面に乗る</text>
