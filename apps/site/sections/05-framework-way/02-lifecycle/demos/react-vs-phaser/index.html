<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>時間で動く Phaser、状態で動く React</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #fdf6e3;
        color: #333;
        font-family:
          system-ui,
          -apple-system,
          'Hiragino Kaku Gothic ProN',
          sans-serif;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .panel {
        display: grid;
        justify-items: center;
        align-content: start;
        gap: 10px;
        padding: 12px;
        border: 2px solid #333;
        border-radius: 8px;
        background: #fff;
      }

      h2 {
        margin: 0;
        font-size: 15px;
      }

      .note {
        margin: 0;
        font-size: 12px;
        color: #777;
        text-align: center;
      }

      canvas {
        display: block;
      }

      .count {
        font-size: 26px;
        font-weight: 700;
        color: #c0392b;
      }

      button {
        font: inherit;
        padding: 8px 18px;
        border: 2px solid #333;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }

      button:hover {
        background: #f0e6cf;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
    <script type="text/babel" src="main.js"></script>
  </head>
  <body>
    <section class="panel">
      <h2>Phaser — 時間が主役</h2>
      <p class="note">update が毎フレーム呼ばれる。何もしなくても進む。</p>
      <div id="stage"></div>
    </section>

    <section class="panel">
      <h2>React — 状態が主役</h2>
      <p class="note">状態が変わったときだけ関数が呼び直される。</p>
      <div id="react-root"></div>
    </section>
  </body>
</html>
