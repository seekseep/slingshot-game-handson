<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>呼ばれる順番</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #fdf6e3;
        color: #333;
        font-family:
          system-ui,
          -apple-system,
          'Hiragino Kaku Gothic ProN',
          sans-serif;
        display: grid;
        grid-template-columns: 340px 1fr;
        grid-template-rows: auto auto;
        gap: 12px;
      }

      canvas {
        display: block;
        border: 2px solid #333;
      }

      .log {
        margin: 0;
        height: 256px;
        overflow-y: auto;
        padding: 10px 12px;
        border: 2px solid #333;
        border-radius: 6px;
        background: #fff;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        line-height: 1.7;
        white-space: pre;
      }

      .buttons {
        grid-column: 1 / -1;
        display: flex;
        justify-content: center;
        gap: 10px;
      }

      button {
        font: inherit;
        padding: 8px 18px;
        border: 2px solid #333;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }

      button:hover {
        background: #f0e6cf;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js"></script>
    <script src="main.js" defer></script>
  </head>
  <body>
    <div id="stage"></div>
    <pre id="log" class="log"></pre>
    <div class="buttons">
      <button id="switch" type="button">別のシーンへ移る（scene.start）</button>
      <button id="clear" type="button">ログを消す</button>
    </div>
  </body>
</html>
