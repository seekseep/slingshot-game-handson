<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>流れに逆らうと、あとで壊れる</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #fdf6e3;
        color: #333;
        font-family:
          system-ui,
          -apple-system,
          'Hiragino Kaku Gothic ProN',
          sans-serif;
        display: grid;
        justify-items: center;
        gap: 12px;
      }

      canvas {
        display: block;
        border: 2px solid #333;
      }

      .buttons {
        display: flex;
        gap: 10px;
      }

      button {
        font: inherit;
        padding: 8px 18px;
        border: 2px solid #333;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }

      button:hover {
        background: #f0e6cf;
      }

      .hint {
        margin: 0;
        font-size: 13px;
        color: #777;
        text-align: center;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js"></script>
    <script src="main.js" defer></script>
  </head>
  <body>
    <div id="stage"></div>
    <div class="buttons">
      <button id="toggle" type="button">
        update で置く（悪い例）に切り替える
      </button>
      <button id="restart" type="button">やり直す</button>
    </div>
    <p class="hint">
      悪い例に切り替えても、画面の見た目は変わりません。丸は 1
      個に見えたままです。<br />
      変わるのは、右に出ている個数と 1 秒あたりのコマ数だけです。
    </p>
  </body>
</html>
