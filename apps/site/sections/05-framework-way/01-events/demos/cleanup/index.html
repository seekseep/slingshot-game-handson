<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登録したものは、誰が外すのか</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #fdf6e3;
        color: #333;
        font-family:
          system-ui,
          -apple-system,
          'Hiragino Kaku Gothic ProN',
          sans-serif;
        display: grid;
        justify-items: center;
        gap: 12px;
      }

      canvas {
        display: block;
        border: 2px solid #333;
      }

      .buttons {
        display: flex;
        gap: 10px;
      }

      button {
        font: inherit;
        padding: 8px 18px;
        border: 2px solid #333;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }

      button:hover {
        background: #f0e6cf;
      }

      .hint {
        margin: 0;
        font-size: 13px;
        color: #777;
        text-align: center;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js"></script>
    <script src="main.js" defer></script>
  </head>
  <body>
    <div id="stage"></div>
    <div class="buttons">
      <button id="restart" type="button">シーンをやり直す</button>
      <button id="reload" type="button">最初から</button>
    </div>
    <p class="hint">
      「シーンをやり直す」を何回か押してから、枠の中を 1
      回クリックしてください。<br />
      Phaser 側は 1 回しか反応しませんが、自分でつけた DOM
      のハンドラは押した回数だけ反応します。
    </p>
  </body>
</html>
