<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ブラウザのイベントと Phaser のイベント</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #fdf6e3;
        color: #333;
        font-family:
          system-ui,
          -apple-system,
          'Hiragino Kaku Gothic ProN',
          sans-serif;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .panel {
        display: grid;
        justify-items: center;
        align-content: start;
        gap: 10px;
        padding: 12px;
        border: 2px solid #333;
        border-radius: 8px;
        background: #fff;
      }

      h2 {
        margin: 0;
        font-size: 15px;
      }

      code {
        font-size: 12px;
        color: #2b6cb0;
        word-break: break-all;
        text-align: center;
      }

      canvas {
        display: block;
      }

      #dom-button {
        font: inherit;
        width: 150px;
        height: 52px;
        border: 3px solid #333;
        border-radius: 6px;
        background: #e08e3c;
        color: #fff;
        cursor: pointer;
      }

      p {
        margin: 0;
        font-size: 15px;
      }

      b {
        font-size: 20px;
        color: #c0392b;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js"></script>
    <script src="main.js" defer></script>
  </head>
  <body>
    <section class="panel">
      <h2>ブラウザ（素の HTML）</h2>
      <code>button.addEventListener('click', …)</code>
      <button id="dom-button" type="button">押す</button>
      <p>押した回数 <b id="dom-count">0</b> 回</p>
    </section>

    <section class="panel">
      <h2>Phaser</h2>
      <code>this.input.on('pointerdown', …)</code>
      <div id="stage"></div>
      <p>押した回数 <b id="phaser-count">0</b> 回</p>
    </section>
  </body>
</html>
